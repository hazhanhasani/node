name: Build BluePanel Node Release

on:
  release:
    types: [created]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/hazhanhasani/bluepanel-node

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set tags
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "DOCKER_TAGS=${{ env.IMAGE }}:${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            echo "DOCKER_TAGS=${{ env.IMAGE }}:${{ github.ref_name }},${{ env.IMAGE }}:latest" >> "$GITHUB_ENV"
          fi

      - name: Build and push BluePanel Node
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKER_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
