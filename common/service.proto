syntax = "proto3";

package service;

option go_package = "github.com/pasarguard/node/common";

message Empty {}

// Base info response message
message BaseInfoResponse {
  bool started = 1;
  string core_version = 2;
  string node_version = 3;
}

enum BackendType {
  XRAY = 0;
  WIREGUARD = 1;
}

message Backend {
  BackendType type = 1;
  string config = 2;
  repeated User users = 3;
  uint64 keep_alive = 4;
  repeated string exclude_inbounds = 5;
}

// log
message Log {
    string detail = 1;
}

// stats
message Stat {
  string name = 1;
  string type = 2;
  string link = 3;
  int64 value = 4;
}

message StatResponse {
  repeated Stat stats = 1;
}

enum StatType {
  Outbounds = 0;
  Outbound = 1;
  Inbounds = 2;
  Inbound = 3;
  UsersStat = 4;
  UserStat = 5;
}

message StatRequest {
  string name = 1;
  bool reset = 2;
  StatType type = 3;
}

message OnlineStatResponse {
  string name = 1;
  int64 value = 2;
}

message StatsOnlineIpListResponse {
  string name = 1;
  map<string, int64> ips = 2;
}

message Latency {
  string name = 1;
  bool alive = 2;
  int64 delay = 3;
  string link = 4;
  int64 last_seen_time = 5;
  int64 last_try_time = 6;
  string source = 7;
}

message LatencyRequest {
  string name = 1;
}

message LatencyResponse {
  repeated Latency latencies = 1;
}

message BackendStatsResponse {
    uint32 num_goroutine = 1;
    uint32 num_gc = 2;
    uint64 alloc = 3;
    uint64 total_alloc = 4;
    uint64 sys = 5;
    uint64 mallocs = 6;
    uint64 frees = 7;
    uint64 live_objects = 8;
    uint64 pause_total_ns = 9;
    uint32 uptime = 10;
}

message SystemStatsResponse {
    uint64 mem_total = 1;
    uint64 mem_used = 2;
    uint64 cpu_cores = 3;
    double cpu_usage = 4;
    uint64 incoming_bandwidth_speed = 5;
    uint64 outgoing_bandwidth_speed = 6;
    uint64 uptime = 7;
}

// User
message Vmess {
    string id = 1;
}

message Vless {
    string id = 1;
    string flow = 2;
}

message Trojan {
    string password = 1;
}

message Shadowsocks {
    string password = 1;
    string method = 2;
}

message Wireguard {
    string public_key = 1;
    repeated string peer_ips = 2;
}

message Hysteria {
    string auth = 1;
}

message Proxy {
    Vmess vmess = 1;
    Vless vless = 2;
    Trojan trojan = 3;
    Shadowsocks shadowsocks = 4;
    Wireguard wireguard = 5;
    Hysteria hysteria = 6;
}

message User {
    string email = 1;
    Proxy proxies = 2;
    repeated string inbounds = 3;
}

message Users {
  repeated User users = 1;
}

message UsersChunk {
  repeated User users = 1;
  uint64 index = 2;
  bool last = 3;
}

// Routing (mirrors xray app/router/command, node-friendly shapes)
message RoutingRule {
  string outbound_tag = 1;
  string rule_tag = 2;
}
message RoutingRulesResponse { repeated RoutingRule rules = 1; }

message BalancerInfoRequest { string tag = 1; }
message BalancerInfoResponse {
  string override_target = 1;
  repeated string principle_target = 2;
}

message TestRouteRequest {
  string inbound_tag = 1;
  string network = 2;          // "tcp" | "udp"
  string target_ip = 3;
  string target_domain = 4;
  uint32 target_port = 5;
  string protocol = 6;
  string user = 7;
  map<string, string> attributes = 8;
  repeated string field_selectors = 9;
  bool publish_result = 10;
}
message RouteResult {
  string outbound_tag = 1;
  repeated string outbound_group_tags = 2;
  string inbound_tag = 3;
  string network = 4;
  string target_domain = 5;
}

message AddRoutingRuleRequest {
  string rule = 1;             // JSON for one xray routing rule (same shape as routing.rules[])
  // false (default) appends the rule, keeping existing rules; true resets the
  // router (clears all rules + balancers) before adding. Default is the safe,
  // non-destructive behavior.
  bool should_reset = 2;
}
message RemoveRoutingRuleRequest { string rule_tag = 1; }
message OverrideBalancerTargetRequest {
  string balancer_tag = 1;
  string target = 2;
}

// Tor Multi-Exit. These messages are an internal typed Node contract; public
// Panel API models may intentionally expose fewer operational fields.
message TorLocationSpec {
  string id = 1;
  string slug = 2;
  string display_name = 3;
  string country_code = 4;
  bool enabled = 5;
  bool subscription_enabled = 6;
  int32 sort_order = 7;
  string base_inbound_tag = 8;
  uint32 xray_inbound_port = 9; // 0 = automatic
  string xray_inbound_tag = 10;
  string xray_outbound_tag = 11;
  string xray_rule_tag = 12;
  uint32 tor_socks_port = 13;   // 0 = automatic
  uint32 tor_control_port = 14; // 0 = automatic
  bool auto_repair = 15;
}

message TorLocation {
  string id = 1;
  string slug = 2;
  string display_name = 3;
  string country_code = 4;
  bool enabled = 5;
  bool subscription_enabled = 6;
  int32 sort_order = 7;
  string base_inbound_tag = 8;
  uint32 xray_inbound_port = 9;
  string xray_inbound_tag = 10;
  string xray_outbound_tag = 11;
  string xray_rule_tag = 12;
  uint32 tor_socks_port = 13;
  uint32 tor_control_port = 14;
  string tor_data_directory = 15;
  string desired_country = 16;
  string detected_country = 17;
  string detected_exit_ip = 18;
  string health_status = 19;
  int64 latency_ms = 20;
  string process_status = 21;
  int64 last_checked_at = 22;
  int64 last_healthy_at = 23;
  string last_error = 24;
  bool auto_repair = 25;
  int32 restart_attempts = 26;
  int64 created_at = 27;
  int64 updated_at = 28;
}

message TorLocationsResponse {
  repeated TorLocation locations = 1;
}

message TorLocationIDRequest {
  string id = 1;
}

message DeleteTorLocationRequest {
  string id = 1;
  bool purge_data = 2;
}

message TorReconcileResponse {
  repeated TorLocation locations = 1;
}

// Service for node management and connection
service NodeService {
  rpc Start (Backend) returns (BaseInfoResponse) {}
  rpc Stop (Empty) returns (Empty) {}
  rpc GetBaseInfo (Empty) returns (BaseInfoResponse) {}

  rpc GetLogs (Empty) returns (stream Log) {}

  rpc GetSystemStats (Empty) returns (SystemStatsResponse) {}
  rpc GetBackendStats (Empty) returns (BackendStatsResponse) {}

  rpc GetStats (StatRequest) returns (StatResponse) {}
  rpc GetOutboundsLatency (LatencyRequest) returns (LatencyResponse) {}

  rpc GetUserOnlineStats (StatRequest) returns (OnlineStatResponse) {}
  rpc GetUserOnlineIpListStats(StatRequest) returns (StatsOnlineIpListResponse) {}

  rpc SyncUser (stream User) returns (Empty) {}
  rpc SyncUsers (Users) returns (Empty) {}
  rpc SyncUsersChunked (stream UsersChunk) returns (Empty) {}

  rpc ListRoutingRules (Empty) returns (RoutingRulesResponse) {}
  rpc GetBalancerInfo (BalancerInfoRequest) returns (BalancerInfoResponse) {}
  rpc TestRoute (TestRouteRequest) returns (RouteResult) {}
  rpc AddRoutingRule (AddRoutingRuleRequest) returns (Empty) {}
  rpc RemoveRoutingRule (RemoveRoutingRuleRequest) returns (Empty) {}
  rpc OverrideBalancerTarget (OverrideBalancerTargetRequest) returns (Empty) {}

  rpc ListTorLocations (Empty) returns (TorLocationsResponse) {}
  rpc GetTorLocation (TorLocationIDRequest) returns (TorLocation) {}
  rpc CreateTorLocation (TorLocationSpec) returns (TorLocation) {}
  rpc UpdateTorLocation (TorLocationSpec) returns (TorLocation) {}
  rpc DeleteTorLocation (DeleteTorLocationRequest) returns (Empty) {}
  rpc EnableTorLocation (TorLocationIDRequest) returns (TorLocation) {}
  rpc DisableTorLocation (TorLocationIDRequest) returns (TorLocation) {}
  rpc RestartTorLocation (TorLocationIDRequest) returns (TorLocation) {}
  rpc NewTorIdentity (TorLocationIDRequest) returns (TorLocation) {}
  rpc GetTorHealth (TorLocationIDRequest) returns (TorLocation) {}
  rpc RepairTorLocation (TorLocationIDRequest) returns (TorLocation) {}
  rpc TestTorLocation (TorLocationIDRequest) returns (TorLocation) {}
  rpc ForceReconcileTor (Empty) returns (TorReconcileResponse) {}
}
